        name: { type: string, minLength: 1, maxLength: 160 }
        weights:
          type: object
          properties:
            fit: { type: number, minimum: 0, maximum: 100 }
            need: { type: number, minimum: 0, maximum: 100 }
            timing: { type: number, minimum: 0, maximum: 100 }
            relationship: { type: number, minimum: 0, maximum: 100 }
          required: [fit, need, timing, relationship]
