        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    SignalPackId:
      name: signalPackId
      in: path
      required: true
      schema:
        type: string
    BusinessTwinVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    IcpVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
    IcpCriterionId:
      name: criterionId
      in: path
      required: true
      schema:
        type: string
    ProjectCompanyId:
      name: projectCompanyId
      in: path
      required: true
      schema:
        type: string
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MaturityStageRequired:
      description: A legacy Business Twin must be saved with a maturity stage before creating a derived version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InterpretationUnavailable:
