    ProviderDiagnostic:
      type: object
      properties:
        providerId: { type: string }
        provider: { type: string }
        providerType: { type: string }
        capability:
          type: ["string", "null"]
          enum: [COMPANY_DISCOVERY, COMPANY_LOOKUP, WEB_SEARCH, WEBSITE_CRAWL, JOB_SEARCH, NEWS_SEARCH, TECH_STACK, LEADERSHIP_SEARCH, PUBLIC_SOCIAL_SEARCH, PERSON_LOOKUP, EMAIL_LOOKUP, PHONE_LOOKUP, null]
        enabled: { type: boolean }
        lastSuccessAt:
          type: ["string", "null"]
          format: date-time
        lastFailureAt:
          type: ["string", "null"]
          format: date-time
        successRate: { type: number }
        latencyMs: { type: number }
        spend: { type: number }
        results: { type: number }
        requestCount: { type: number }
      required:
        - providerId
