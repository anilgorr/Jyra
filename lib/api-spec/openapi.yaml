        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectCompanyId"
      responses:
        "200":
          description: Current WHY with inspectable traces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityWhyDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/companies/{projectCompanyId}/opportunity/why/generate:
    post:
      operationId: generateOpportunityWhy
      tags: [opportunity-engine]
      summary: Generate a bounded WHY only from current traced evidence
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectCompanyId"
      responses:
        "200":
          description: Generated WHY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityWhyGeneration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/opportunity-models:
    get:
      operationId: listOpportunityModels
      tags: [opportunity-engine]
      summary: List immutable opportunity model versions
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Model versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OpportunityModelVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOpportunityModel
      tags: [opportunity-engine]
      summary: Create and activate a new immutable model version
      security: [{ clerkSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOpportunityModelRequest" }
      responses:
        "201":
          description: New active model version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityModelVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  schemas:
    OpportunityPack:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        offeringKey: { type: string }
        status: { type: string }
        currentVersion: { type: number }
      required: [id, organizationId, projectId, offeringKey, status, currentVersion]
      additionalProperties: true
    OpportunityPackVersion:
      type: object
      properties:
        id: { type: string }
        intelligencePackId: { type: string }
        version: { type: number }
        status: { type: string, enum: [PROPOSED, APPROVED, ACTIVATED] }
        lifecycleLabel: { type: string, enum: [HYPOTHESIS-LED, EVIDENCE-INFORMED] }
        offeringSnapshot: { type: object, additionalProperties: true }
        businessContextSnapshot: { type: object, additionalProperties: true }
        assumptions:
          type: array
          items: { type: string }
        sourceBusinessTwinVersionId: { type: [string, "null"] }
        sourceIcpVersionId: { type: [string, "null"] }
      required: [id, intelligencePackId, version, status, lifecycleLabel, offeringSnapshot, businessContextSnapshot, assumptions]
      additionalProperties: true
    OpportunitySignalProposal:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        whyItMatters: { type: string }
        category: { type: string }
        polarity: { type: string, enum: [POSITIVE, NEGATIVE] }
        needImpact: { type: number, minimum: -100, maximum: 100 }
        timingImpact: { type: number, minimum: -100, maximum: 100 }
        fitImpact: { type: number, minimum: -100, maximum: 100 }
        likelyEvidence: { type: array, items: { type: string } }
        sourceCapabilities: { type: array, items: { type: string } }
        lifetimeDays: { type: number, minimum: 1, maximum: 730 }
        suggestedStrength: { type: number, minimum: 0, maximum: 100 }
        minimumConfidence: { type: number, minimum: 0, maximum: 100 }
        potentialFalsePositives: { type: array, items: { type: string } }
        reviewStatus: { type: string }
        hypothesis: { type: boolean }
      required: [id, code, name, description, whyItMatters, category, polarity, needImpact, timingImpact, fitImpact, likelyEvidence, sourceCapabilities, lifetimeDays, suggestedStrength, minimumConfidence, potentialFalsePositives, reviewStatus, hypothesis]
      additionalProperties: true
    OpportunityResearchQuestion:
      type: object
      properties:
        id: { type: string }
        questionText: { type: string }
        reason: { type: string }
        sourceCapabilities: { type: array, items: { type: string } }
        priority: { type: number, minimum: 1, maximum: 100 }
        expectedInformationGain: { type: number, minimum: 0, maximum: 100 }
        estimatedCost: { type: number, minimum: 0, maximum: 5 }
        reviewStatus: { type: string }
      required: [id, questionText, reason, sourceCapabilities, priority, expectedInformationGain, estimatedCost, reviewStatus]
      additionalProperties: true
    OpportunityClusterProposal:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        requiredSignalCodes: { type: array, items: { type: string } }
        optionalSignalCodes: { type: array, items: { type: string } }
        negativeSignalCodes: { type: array, items: { type: string } }
        minimumIndependentSignals: { type: number }
        timeWindowDays: { type: number }
        defaultStrength: { type: number }
        needImpact: { type: number }
        timingImpact: { type: number }
        reviewStatus: { type: string }
        hypothesis: { type: boolean }
      required: [id, name, description, requiredSignalCodes, optionalSignalCodes, negativeSignalCodes, minimumIndependentSignals, timeWindowDays, defaultStrength, needImpact, timingImpact, reviewStatus, hypothesis]
      additionalProperties: true
    OpportunityPackDetail:
      type: object
      properties:
        pack: { $ref: "#/components/schemas/OpportunityPack" }
        version: { $ref: "#/components/schemas/OpportunityPackVersion" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/OpportunitySignalProposal" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/OpportunityResearchQuestion" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/OpportunityClusterProposal" }
      required: [pack, version, signals, questions, clusters]
    OpportunityPackList:
      type: object
      properties:
        packs:
          type: array
          items: { $ref: "#/components/schemas/OpportunityPack" }
        versions:
          type: array
          items: { $ref: "#/components/schemas/OpportunityPackVersion" }
      required: [packs, versions]
    ProposeOpportunityPackRequest:
      type: object
      properties:
        offering:
          type: object
          additionalProperties: true
          minProperties: 1
        assumptions:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 1000 }
      required: [offering, assumptions]
      additionalProperties: false
    OpportunityItemReviewRequest:
      type: object
      properties:
        reviewStatus: { type: string, enum: [APPROVED, DISABLED, REMOVED] }
      required: [reviewStatus]
      additionalProperties: false
    OpportunityPackGeneration:
      type: object
      properties:
        pack: { $ref: "#/components/schemas/OpportunityPack" }
        version: { $ref: "#/components/schemas/OpportunityPackVersion" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/OpportunitySignalProposal" }
        questionCount: { type: number }
        clusterCount: { type: number }
      required: [pack, version, signals, questionCount, clusterCount]
    CreateSignalClusterDefinitionRequest:
      type: object
      properties:
        intelligencePackId: { type: [string, "null"] }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        requiredSignalCodes: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
        optionalSignalCodes: { type: array, maxItems: 10, items: { type: string } }
        negativeSignalCodes: { type: array, maxItems: 10, items: { type: string } }
        minimumIndependentSignals: { type: number, minimum: 1, maximum: 20 }
        timeWindowDays: { type: number, minimum: 1, maximum: 730 }
        defaultStrength: { type: number, minimum: 0, maximum: 100 }
        needImpact: { type: number, minimum: -100, maximum: 100 }
        timingImpact: { type: number, minimum: -100, maximum: 100 }
      required: [name, description, requiredSignalCodes, optionalSignalCodes, negativeSignalCodes, minimumIndependentSignals, timeWindowDays, defaultStrength, needImpact, timingImpact]
      additionalProperties: false
    SignalClusterDefinition:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        intelligencePackId: { type: [string, "null"] }
        name: { type: string }
        description: { type: string }
        requiredSignalCodes: { type: array, items: { type: string } }
        optionalSignalCodes: { type: array, items: { type: string } }
        negativeSignalCodes: { type: array, items: { type: string } }
        minimumIndependentSignals: { type: number }
        timeWindowDays: { type: number }
        defaultStrength: { type: number }
        needImpact: { type: number }
        timingImpact: { type: number }
        status: { type: string }
        active: { type: boolean }
        version: { type: number }
      required: [id, organizationId, projectId, name, description, requiredSignalCodes, optionalSignalCodes, negativeSignalCodes, minimumIndependentSignals, timeWindowDays, defaultStrength, needImpact, timingImpact, status, active, version]
      additionalProperties: true
    ConfigureSignalClusterDefinitionRequest:
      type: object
      properties:
        active: { type: boolean }
      required: [active]
      additionalProperties: false
    SignalClusterRecord:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        companyId: { type: string }
        definitionId: { type: string }
        triggeredSignalIds: { type: array, items: { type: string } }
        supportingEvidenceIds: { type: array, items: { type: string } }
        independenceSnapshot: { type: object, additionalProperties: true }
        temporalSnapshot: { type: object, additionalProperties: true }
        explanation: { type: string }
        originalStrength: { type: number }
        currentStrength: { type: number }
        confidence: { type: number }
        needImpact: { type: number }
        timingImpact: { type: number }
        status: { type: string }
        ruleVersion: { type: string }
      required: [id, projectId, companyId, definitionId, triggeredSignalIds, supportingEvidenceIds, independenceSnapshot, temporalSnapshot, explanation, originalStrength, currentStrength, confidence, needImpact, timingImpact, status, ruleVersion]
      additionalProperties: true
    SignalCluster:
      type: object
      properties:
        id: { type: string }
        definition: { $ref: "#/components/schemas/SignalClusterDefinition" }
        members:
          type: array
          items:
            type: object
            additionalProperties: true
        explanation: { type: string }
        currentStrength: { type: number }
        confidence: { type: number }
        independenceSnapshot: { type: object, additionalProperties: true }
        temporalSnapshot: { type: object, additionalProperties: true }
        supportingEvidenceIds: { type: array, items: { type: string } }
      required: [id, definition, members, explanation, currentStrength, confidence, independenceSnapshot, temporalSnapshot, supportingEvidenceIds]
      additionalProperties: true
    UpdateOpportunitySignalRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        whyItMatters: { type: string }
        category: { type: string }
        polarity: { type: string, enum: [POSITIVE, NEGATIVE] }
        needImpact: { type: number, minimum: -100, maximum: 100 }
        timingImpact: { type: number, minimum: -100, maximum: 100 }
        fitImpact: { type: number, minimum: -100, maximum: 100 }
        lifetimeDays: { type: number, minimum: 1, maximum: 730 }
        suggestedStrength: { type: number, minimum: 0, maximum: 100 }
        minimumConfidence: { type: number, minimum: 0, maximum: 100 }
      additionalProperties: false
    AddOpportunitySignalRequest:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        whyItMatters: { type: string }
        category: { type: string }
        polarity: { type: string, enum: [POSITIVE, NEGATIVE] }
        needImpact: { type: number, minimum: -100, maximum: 100 }
        timingImpact: { type: number, minimum: -100, maximum: 100 }
        fitImpact: { type: number, minimum: -100, maximum: 100 }
        likelyEvidence: { type: array, items: { type: string } }
        sourceCapabilities: { type: array, minItems: 1, items: { type: string } }
        lifetimeDays: { type: number, minimum: 1, maximum: 730 }
        suggestedStrength: { type: number, minimum: 0, maximum: 100 }
        minimumConfidence: { type: number, minimum: 0, maximum: 100 }
        potentialFalsePositives: { type: array, items: { type: string } }
        factTypes: { type: array, items: { type: string } }
        matchingConfiguration: { type: object, additionalProperties: true }
        hypothesis: { type: boolean }
      required: [code, name, description, whyItMatters, category, polarity, needImpact, timingImpact, fitImpact, likelyEvidence, sourceCapabilities, lifetimeDays, suggestedStrength, minimumConfidence, potentialFalsePositives, factTypes, matchingConfiguration, hypothesis]
      additionalProperties: false
    UpdateOpportunityResearchQuestionRequest:
      type: object
      properties:
        questionText: { type: string }
        reason: { type: string }
        sourceCapabilities: { type: array, minItems: 1, items: { type: string } }
        priority: { type: number, minimum: 1, maximum: 100 }
        expectedInformationGain: { type: number, minimum: 0, maximum: 100 }
        estimatedCost: { type: number, minimum: 0, maximum: 5 }
