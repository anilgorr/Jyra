name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The OpenAI integration client throws at import time without these;
      # the deterministic tests never call the API.
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://localhost
      AI_INTEGRATIONS_OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit suites
        # Every suite in this gate runs with no database, no API keys and no
        # network. A suite that needs a live Postgres declares
        # @requires-database and is excluded here.
        run: pnpm run test:unit

      - name: Build
        # Vite configs default PORT/BASE_PATH; a clean checkout must build.
        run: pnpm -r run build
