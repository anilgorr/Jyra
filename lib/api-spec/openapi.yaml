        id: { type: string }
        organizationId: { type: string }
        projectId: { type: string }
        projectCompanyId: { type: string }
        companyId: { type: string }
        modelVersionId: { type: string }
        score: { type: ["number", "null"] }
        fitScore: { type: ["number", "null"] }
        needScore: { type: ["number", "null"] }
        timingScore: { type: ["number", "null"] }
        relationshipScore: { type: ["number", "null"] }
        confidenceScore: { type: ["number", "null"] }
        state: { type: string, enum: [DORMANT, WATCH, EMERGING, RISING, SURGING, ACTIVE, COOLING] }
        assessmentStatus: { type: string, enum: [COMPLETE, NEEDS_MORE_RESEARCH, INSUFFICIENT_DATA] }
