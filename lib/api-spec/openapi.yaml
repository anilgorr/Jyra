openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Foundation workspace status operations
  - name: identity
    description: Authenticated user and tenancy operations
  - name: business-twin
    description: Versioned seller Business Twin configuration
  - name: icp
    description: Objective, versioned Ideal Customer Profile rules
  - name: companies
    description: Canonical company identity and project company operations
  - name: providers
    description: Development-only provider diagnostics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace/summary:
    get:
      operationId: getWorkspaceSummary
      tags: [workspace]
      summary: Get foundation workspace summary
      description: Returns the current foundation milestone status without inventing market or company intelligence.
      responses:
        "200":
          description: Foundation workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
  /workspace/capabilities:
    get:
      operationId: getWorkspaceCapabilities
      tags: [workspace]
      summary: List product capability phases
      description: Returns the documented product phases and their implementation status.
      responses:
        "200":
          description: Product capability phases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityPhase"
  /workspace/activity:
    get:
      operationId: getWorkspaceActivity
      tags: [workspace]
      summary: List workspace activity
      description: Returns activity recorded by implemented workspace workflows. The foundation milestone intentionally returns an empty list.
      responses:
        "200":
          description: Workspace activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceActivity"
  /workspace/providers/diagnostics:
    get:
      operationId: getProviderDiagnostics
      tags: [providers]
      summary: Get development provider diagnostics
      description: Returns non-secret provider health and usage totals in development only.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Provider diagnostics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderDiagnostic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated user
      description: Returns the local JYRA user record and organization count for the authenticated Clerk session.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [identity]
      summary: List organizations for the authenticated user
      security:
        - clerkSession: []
      responses:
        "200":
          description: Organizations the user belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrganization
      tags: [identity]
      summary: Create an organization
      description: Creates an organization and adds the authenticated user as its owner.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations/{organizationId}/projects:
    get:
      operationId: listProjects
      tags: [identity]
      summary: List projects in an organization
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Projects in the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProject
      tags: [identity]
      summary: Create a project
      description: Creates a project after verifying the authenticated user belongs to the organization.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [identity]
      summary: Get a project
      description: Returns a project only when the authenticated user has membership in its organization.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/business-twin:
    get:
      operationId: getBusinessTwin
      tags: [business-twin]
      summary: Get the current Business Twin version
      description: Returns the current project-scoped Business Twin version after verifying project membership.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Current Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/business-twin/versions:
    get:
      operationId: listBusinessTwinVersions
      tags: [business-twin]
      summary: List Business Twin versions
      description: Returns all project-scoped Business Twin versions from newest to oldest.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Business Twin version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createBusinessTwinVersion
      tags: [business-twin]
      summary: Save Business Twin answers as a new version
      description: Creates a new immutable Business Twin version from explicit seller answers and a validated interpretation.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessTwinVersionInput"
      responses:
        "201":
          description: Created Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/InterpretationUnavailable"
  /projects/{projectId}/business-twin/versions/{versionId}:
    get:
      operationId: getBusinessTwinVersion
      tags: [business-twin]
      summary: Get a Business Twin version
      description: Returns a specific version only when it belongs to the requested project and the user has project membership.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BusinessTwinVersionId"
      responses:
        "200":
          description: Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/business-twin/regenerate:
    post:
      operationId: regenerateBusinessTwin
      tags: [business-twin]
      summary: Regenerate the current Business Twin interpretation
      description: Creates a new version from the current raw answers and a newly validated interpretation.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Regenerated Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MaturityStageRequired"
        "502":
          $ref: "#/components/responses/InterpretationUnavailable"
  /projects/{projectId}/business-twin/versions/{versionId}/interpretation:
    patch:
      operationId: updateBusinessTwinInterpretation
      tags: [business-twin]
      summary: Save manual Business Twin interpretation refinements
      description: Creates a new immutable version carrying the selected version's raw answers and manually refined interpretation.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BusinessTwinVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessTwinManualInterpretationInput"
      responses:
        "201":
          description: Created manually refined Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MaturityStageRequired"
  /projects/{projectId}/icp:
    get:
      operationId: getIcp
      tags: [icp]
      summary: Get the current ICP
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Current ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/generate:
    post:
      operationId: generateIcp
      tags: [icp]
      summary: Generate ICP suggestions from the current Business Twin
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "201":
          description: Generated ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions:
    get:
      operationId: listIcpVersions
      tags: [icp]
      summary: List ICP versions
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: ICP version history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/icp/versions/{versionId}:
    get:
      operationId: getIcpVersion
      tags: [icp]
      summary: Get an ICP version
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
      responses:
        "200":
          description: ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/regenerate:
    post:
      operationId: regenerateIcp
      tags: [icp]
      summary: Regenerate ICP suggestions
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "201":
          description: Regenerated ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions/{versionId}/criteria:
    post:
      operationId: addIcpCriterion
      tags: [icp]
      summary: Add a criterion to an ICP
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcpCriterionInput" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions/{versionId}/criteria/{criterionId}:
    patch:
      operationId: updateIcpCriterion
      tags: [icp]
      summary: Edit an ICP criterion
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
        - { $ref: "#/components/parameters/IcpCriterionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcpCriterionUpdate" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIcpCriterion
      tags: [icp]
      summary: Delete an ICP criterion
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
        - { $ref: "#/components/parameters/IcpCriterionId" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions/{versionId}/criteria/{criterionId}/accept:
    post:
      operationId: acceptIcpCriterion
      tags: [icp]
      summary: Accept an ICP criterion
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
        - { $ref: "#/components/parameters/IcpCriterionId" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [identity]
      summary: Create an organization and first project
      description: Completes first-login onboarding with one organization and its first project.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "201":
          description: Created organization and first project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/{projectId}/companies:
    get:
      operationId: listProjectCompanies
      tags: [companies]
      summary: List companies linked to a project
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Companies linked to the project
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectCompany" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createProjectCompany
      tags: [companies]
      summary: Add a company to a project
      description: Creates or reuses a canonical company after deterministic identity checks.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "201":
          description: Company linked to the project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCompany" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Manual duplicate review is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyImportPreview" }
  /projects/{projectId}/companies/{projectCompanyId}:
    patch:
      operationId: updateProjectCompany
      tags: [companies]
      summary: Update project-specific company state
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCompanyUpdate" }
      responses:
        "200":
          description: Updated project company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCompany" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/companies/{projectCompanyId}/evidence:
    get:
      operationId: listCompanyEvidence
      tags: [companies]
      summary: List public evidence for a project company
      description: Returns globally reusable source evidence for the canonical company linked to the project.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
      responses:
        "200":
          description: Company evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyEvidence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCompanyEvidence
      tags: [companies]
      summary: Preserve a public source observation
      description: Captures immutable raw source content and a source-grounded claim for the canonical company.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyEvidenceInput" }
      responses:
        "201":
          description: Preserved company evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyEvidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The unchanged source observation already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyEvidenceDuplicate" }
  /projects/{projectId}/companies/{projectCompanyId}/evidence/{evidenceId}:
    patch:
      operationId: updateCompanyEvidenceStatus
      tags: [companies]
      summary: Transition company evidence status
      description: Changes only the review status; preserved source content and provenance cannot be rewritten.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
        - { $ref: "#/components/parameters/EvidenceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyEvidenceStatusUpdate" }
      responses:
        "200":
          description: Updated evidence status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyEvidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/companies/{projectCompanyId}/facts:
    get:
      operationId: listCompanyFacts
      tags: [companies]
      summary: List structured facts for a project company
      description: Returns source-grounded structured facts linked to the canonical company and preserved evidence.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
      responses:
        "200":
          description: Company facts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyFact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createCompanyFact
      tags: [companies]
      summary: Save a validated structured fact
      description: Persists a fact only when its evidence reference, effective date, confidence, and supporting excerpt pass deterministic validation.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyFactInput" }
      responses:
        "201":
          description: Created structured fact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyFact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This fact already exists for the evidence observation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyFactDuplicate" }
  /projects/{projectId}/companies/{projectCompanyId}/facts/extract:
    post:
      operationId: extractCompanyFacts
      tags: [companies]
      summary: Propose structured facts from preserved evidence
      description: Uses the managed model only to propose strict JSON candidates; candidates are validated deterministically and are not persisted by this endpoint.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ProjectCompanyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactExtractionInput" }
      responses:
        "200":
          description: Validated fact candidates and rejected candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactExtractionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/InterpretationUnavailable" }
  /projects/{projectId}/companies/import/preview:
    post:
      operationId: previewCompanyImport
      tags: [companies]
      summary: Preview and resolve company identities
      description: Normalizes and validates import rows without creating or linking companies.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyImportInput" }
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/companies/import/commit:
    post:
      operationId: commitCompanyImport
      tags: [companies]
      summary: Commit an explicitly reviewed company import
      description: Creates or reuses canonical companies and links them to the project only after duplicate decisions are explicit.
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyImportCommitInput" }
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Identity state changed after preview; refresh duplicate review before committing.
          content:
            application/json:
              schema:
                type: object
                required: [error, needsReview]
                properties:
                  error: { type: string }
                  needsReview: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
