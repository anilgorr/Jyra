openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Foundation workspace status operations
  - name: identity
    description: Authenticated user and tenancy operations
  - name: business-twin
    description: Versioned seller Business Twin configuration
  - name: icp
    description: Objective, versioned Ideal Customer Profile rules
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace/summary:
    get:
      operationId: getWorkspaceSummary
      tags: [workspace]
      summary: Get foundation workspace summary
      description: Returns the current foundation milestone status without inventing market or company intelligence.
      responses:
        "200":
          description: Foundation workspace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
  /workspace/capabilities:
    get:
      operationId: getWorkspaceCapabilities
      tags: [workspace]
      summary: List product capability phases
      description: Returns the documented product phases and their implementation status.
      responses:
        "200":
          description: Product capability phases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityPhase"
  /workspace/activity:
    get:
      operationId: getWorkspaceActivity
      tags: [workspace]
      summary: List workspace activity
      description: Returns activity recorded by implemented workspace workflows. The foundation milestone intentionally returns an empty list.
      responses:
        "200":
          description: Workspace activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceActivity"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated user
      description: Returns the local JYRA user record and organization count for the authenticated Clerk session.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    get:
      operationId: listOrganizations
      tags: [identity]
      summary: List organizations for the authenticated user
      security:
        - clerkSession: []
      responses:
        "200":
          description: Organizations the user belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrganization
      tags: [identity]
      summary: Create an organization
      description: Creates an organization and adds the authenticated user as its owner.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations/{organizationId}/projects:
    get:
      operationId: listProjects
      tags: [identity]
      summary: List projects in an organization
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Projects in the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProject
      tags: [identity]
      summary: Create a project
      description: Creates a project after verifying the authenticated user belongs to the organization.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [identity]
      summary: Get a project
      description: Returns a project only when the authenticated user has membership in its organization.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/business-twin:
    get:
      operationId: getBusinessTwin
      tags: [business-twin]
      summary: Get the current Business Twin version
      description: Returns the current project-scoped Business Twin version after verifying project membership.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Current Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/business-twin/versions:
    get:
      operationId: listBusinessTwinVersions
      tags: [business-twin]
      summary: List Business Twin versions
      description: Returns all project-scoped Business Twin versions from newest to oldest.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Business Twin version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createBusinessTwinVersion
      tags: [business-twin]
      summary: Save Business Twin answers as a new version
      description: Creates a new immutable Business Twin version from explicit seller answers and a validated interpretation.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessTwinVersionInput"
      responses:
        "201":
          description: Created Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/InterpretationUnavailable"
  /projects/{projectId}/business-twin/versions/{versionId}:
    get:
      operationId: getBusinessTwinVersion
      tags: [business-twin]
      summary: Get a Business Twin version
      description: Returns a specific version only when it belongs to the requested project and the user has project membership.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BusinessTwinVersionId"
      responses:
        "200":
          description: Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/business-twin/regenerate:
    post:
      operationId: regenerateBusinessTwin
      tags: [business-twin]
      summary: Regenerate the current Business Twin interpretation
      description: Creates a new version from the current raw answers and a newly validated interpretation.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Regenerated Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/InterpretationUnavailable"
  /projects/{projectId}/business-twin/versions/{versionId}/interpretation:
    patch:
      operationId: updateBusinessTwinInterpretation
      tags: [business-twin]
      summary: Save manual Business Twin interpretation refinements
      description: Creates a new immutable version carrying the selected version's raw answers and manually refined interpretation.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/BusinessTwinVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessTwinManualInterpretationInput"
      responses:
        "201":
          description: Created manually refined Business Twin version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTwinVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/icp:
    get:
      operationId: getIcp
      tags: [icp]
      summary: Get the current ICP
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Current ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/generate:
    post:
      operationId: generateIcp
      tags: [icp]
      summary: Generate ICP suggestions from the current Business Twin
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "201":
          description: Generated ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions:
    get:
      operationId: listIcpVersions
      tags: [icp]
      summary: List ICP versions
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: ICP version history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/icp/versions/{versionId}:
    get:
      operationId: getIcpVersion
      tags: [icp]
      summary: Get an ICP version
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
      responses:
        "200":
          description: ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/regenerate:
    post:
      operationId: regenerateIcp
      tags: [icp]
      summary: Regenerate ICP suggestions
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "201":
          description: Regenerated ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions/{versionId}/criteria:
    post:
      operationId: addIcpCriterion
      tags: [icp]
      summary: Add a criterion to an ICP
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcpCriterionInput" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions/{versionId}/criteria/{criterionId}:
    patch:
      operationId: updateIcpCriterion
      tags: [icp]
      summary: Edit an ICP criterion
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
        - { $ref: "#/components/parameters/IcpCriterionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IcpCriterionUpdate" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIcpCriterion
      tags: [icp]
      summary: Delete an ICP criterion
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
        - { $ref: "#/components/parameters/IcpCriterionId" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/icp/versions/{versionId}/criteria/{criterionId}/accept:
    post:
      operationId: acceptIcpCriterion
      tags: [icp]
      summary: Accept an ICP criterion
      security: [{ clerkSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IcpVersionId" }
        - { $ref: "#/components/parameters/IcpCriterionId" }
      responses:
        "201":
          description: New ICP version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IcpVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /onboarding:
    post:
      operationId: completeOnboarding
      tags: [identity]
      summary: Create an organization and first project
      description: Completes first-login onboarding with one organization and its first project.
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "201":
          description: Created organization and first project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorkspaceSummary:
      type: object
      properties:
        milestone:
          type: string
        milestoneLabel:
          type: string
        researchStatus:
          type: string
        intelligenceCount:
          type: number
        activeSignalCount:
          type: number
        qualifiedCompanyCount:
          type: number
        nextMilestone:
          type: string
      required:
        - milestone
        - milestoneLabel
        - researchStatus
        - intelligenceCount
        - activeSignalCount
        - qualifiedCompanyCount
        - nextMilestone
    CapabilityPhase:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        status:
          type: string
        order:
          type: number
      required:
        - id
        - label
        - description
        - status
        - order
    WorkspaceActivity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        occurredAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - label
        - occurredAt
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        organizationCount:
          type: number
      required:
        - id
        - organizationCount
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
    OrganizationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
      required:
        - name
    Project:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - name
        - description
        - status
        - createdAt
        - updatedAt
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: ["string", "null"]
          maxLength: 500
      required:
        - name
    OnboardingInput:
      type: object
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
        projectName:
          type: string
          minLength: 2
          maxLength: 120
      required:
        - organizationName
        - projectName
    OnboardingResponse:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        project:
          $ref: "#/components/schemas/Project"
      required:
        - organization
        - project
    BusinessTwinCustomerExample:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        whyGoodCustomer:
          type: string
          maxLength: 2000
        whyBoughtThen:
          type: string
          maxLength: 2000
      required:
        - name
        - whyGoodCustomer
        - whyBoughtThen
    BusinessTwinRawAnswers:
      type: object
      properties:
        companyName:
          type: string
          maxLength: 200
        website:
          type: string
          maxLength: 500
        primaryGeography:
          type: string
          maxLength: 200
        industry:
          type: string
          maxLength: 200
        offeringName:
          type: string
          maxLength: 200
        productOrServiceDescription:
          type: string
          maxLength: 3000
        problemsSolved:
          type: string
          maxLength: 3000
        costOfInaction:
          type: string
          maxLength: 3000
        typicalCustomerProfile:
          type: string
          maxLength: 2000
        typicalEmployeeRange:
          type: string
          maxLength: 200
        typicalRevenueRange:
          type: string
          maxLength: 200
        typicalDealSize:
          type: string
          maxLength: 200
        typicalSalesCycle:
          type: string
          maxLength: 200
        targetGeographies:
          type: string
          maxLength: 1000
        bestCustomers:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/BusinessTwinCustomerExample"
        badCustomerCharacteristics:
          type: string
          maxLength: 3000
        commonBuyerRoles:
          type: string
          maxLength: 1000
        commonChampionRoles:
          type: string
          maxLength: 1000
        commonTechnicalEvaluatorRoles:
          type: string
          maxLength: 1000
        typicalUrgencyTriggers:
          type: string
          maxLength: 3000
        majorDifferentiators:
          type: string
          maxLength: 3000
        competitorsOrAlternatives:
          type: string
          maxLength: 2000
        commonObjections:
          type: string
          maxLength: 3000
      required:
        - companyName
        - website
        - primaryGeography
        - industry
        - offeringName
        - productOrServiceDescription
        - problemsSolved
        - costOfInaction
        - typicalCustomerProfile
        - typicalEmployeeRange
        - typicalRevenueRange
        - typicalDealSize
        - typicalSalesCycle
        - targetGeographies
        - bestCustomers
        - badCustomerCharacteristics
        - commonBuyerRoles
        - commonChampionRoles
        - commonTechnicalEvaluatorRoles
        - typicalUrgencyTriggers
        - majorDifferentiators
        - competitorsOrAlternatives
        - commonObjections
    BusinessTwinInterpretation:
      type: object
      properties:
        offering_summary:
          type: string
          maxLength: 3000
        problems_solved:
          type: array
          items:
            type: string
            maxLength: 500
        business_outcomes:
          type: array
          items:
            type: string
            maxLength: 500
        ideal_customer_patterns:
          type: array
          items:
            type: string
            maxLength: 500
        negative_customer_patterns:
          type: array
          items:
            type: string
            maxLength: 500
        buying_triggers:
          type: array
          items:
            type: string
            maxLength: 500
        buyer_roles:
          type: array
          items:
            type: string
            maxLength: 300
        champion_roles:
          type: array
          items:
            type: string
            maxLength: 300
        technical_roles:
          type: array
          items:
            type: string
            maxLength: 300
        industries:
          type: array
          items:
            type: string
            maxLength: 300
        geographies:
          type: array
          items:
            type: string
            maxLength: 300
        company_size_patterns:
          type: array
          items:
            type: string
            maxLength: 300
        technology_patterns:
          type: array
          items:
            type: string
            maxLength: 300
        compliance_patterns:
          type: array
          items:
            type: string
            maxLength: 300
        urgency_patterns:
          type: array
          items:
            type: string
            maxLength: 500
        disqualifier_hypotheses:
          type: array
          items:
            type: string
            maxLength: 500
        differentiators:
          type: array
          items:
            type: string
            maxLength: 500
        common_objections:
          type: array
          items:
            type: string
            maxLength: 500
      required:
        - offering_summary
        - problems_solved
        - business_outcomes
        - ideal_customer_patterns
        - negative_customer_patterns
        - buying_triggers
        - buyer_roles
        - champion_roles
        - technical_roles
