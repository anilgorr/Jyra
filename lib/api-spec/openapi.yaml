        clusters: { type: array, items: { $ref: "#/components/schemas/WhyTraceCluster" } }
        facts: { type: array, items: { $ref: "#/components/schemas/WhyTraceFact" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/WhyTraceEvidence" } }
